[package]
name = "ocr-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop GUI for ocr-tool"

[[bin]]
name = "ocr-tool-gui"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
anyhow.workspace = true
eframe = "0.31"
egui = "0.31"
rfd = "0.15"
open = "5"
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
image.workspace = true
ocr-core = { path = "../ocr-core" }
ocr-app = { path = "../ocr-app" }
ocr-pdf = { path = "../ocr-pdf" }
ocr-engine = { path = "../ocr-engine" }

[dev-dependencies]
tempfile.workspace = true
