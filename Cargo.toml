[workspace]
resolver = "2"
members = [
    "crates/ocr-core",
    "crates/ocr-pdf",
    "crates/ocr-engine",
    "crates/ocr-app",
    "crates/ocr-cli",
    "crates/ocr-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"
repository = "https://github.com/onive/ocr-tool"
homepage = "https://github.com/onive/ocr-tool"
authors = ["Igor Beliaev <mail@onive.ru>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp"] }
pdfium-render = "0.9"
ureq = { version = "2", features = ["json", "native-certs"] }
ammonia = "4"
htmd = "0.6"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
walkdir = "2"
tempfile = "3"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
